name: Export Blacklist Snippet

on:
  schedule:
    - cron: '0 0 * * *' # every day at midnight UTC
  workflow_dispatch:     # allows manual triggering from GitHub UI

jobs:
  export-blacklist-snippet:
    runs-on: ubuntu-latest

    steps:
      - name: Call backend export_snippet endpoint
        run: |
          curl -X POST ${{ secrets.BLACKLIST_EXPORT_ENDPOINT }} \
            -H "Authorization: Bearer ${{ secrets.VITE_DBS_ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            --fail
